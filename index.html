<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flux — SinkOS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--
    This file works two ways:
    1. Opened directly in a browser -> it self-mounts into #flux-standalone-mount
       below, so you get a live, styled preview of the app.
    2. Fetched by flux.js from inside SinkOS -> only the <template> contents
       are cloned out and injected into whatever window container SinkOS gives it.
    Either way, style.css and flux.js must sit alongside this file.
  -->

  <div id="flux-standalone-mount" class="flux-standalone-mount"></div>

  <template id="flux-window-template">
    <div class="flux-window" id="flux-window">
      <div class="flux-grid" aria-hidden="true"></div>
      <div class="flux-aurora" aria-hidden="true"></div>

      <aside class="flux-sidebar" id="flux-sidebar">
        <button class="flux-new-chat-btn" id="flux-new-chat-btn">+ New chat</button>
        <div class="flux-conversation-list" id="flux-conversation-list">
          <!-- conversation items injected by flux.js -->
        </div>
      </aside>

      <div class="flux-main">
        <header class="flux-titlebar">
          <div class="flux-titlebar-left">
            <button class="flux-icon-btn flux-sidebar-toggle" id="flux-sidebar-toggle" title="Toggle chat history">☰</button>
            <span class="flux-title">FLUX</span>
            <span class="flux-status"><span class="flux-status-dot"></span>ONLINE</span>
          </div>
          <div class="flux-titlebar-right">
            <span class="flux-tag">SINKOS AI // FLUX-01</span>
            <button class="flux-icon-btn" id="flux-clear-btn" title="Clear this conversation">⟲</button>
            <button class="flux-icon-btn" id="flux-settings-btn" title="Settings">⚙</button>
          </div>
        </header>

        <div class="flux-body">
          <div class="flux-messages" id="flux-messages">
            <div class="flux-msg flux-msg-assistant">
              <div class="flux-msg-role">Flux</div>
              <div class="flux-msg-content">Hey, I'm Flux. Ask me anything about SinkOS or beyond.</div>
            </div>
          </div>

          <form class="flux-input-bar" id="flux-input-form">
            <div class="flux-input-row">
              <textarea
                id="flux-input"
                class="flux-input"
                placeholder="Ask me anything…"
                rows="1"
              ></textarea>
              <button type="button" class="flux-mic-btn" id="flux-mic-btn" title="Hold to talk">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
                  <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
                </svg>
              </button>
              <button type="submit" class="flux-send-btn" id="flux-send-btn">SEND</button>
            </div>
            <div class="flux-input-hint" id="flux-input-hint">Press Enter to send · Hold 🎤 to talk</div>
          </form>
        </div>
      </div>

      <!-- Settings panel (hidden by default) -->
      <div class="flux-settings-panel" id="flux-settings-panel" hidden>
        <h3>Flux Settings</h3>
        <label for="flux-api-base">Backend URL</label>
        <input type="text" id="flux-api-base" placeholder="http://localhost:5001" />
        <button id="flux-settings-save">Save</button>
        <button id="flux-settings-close">Close</button>
      </div>
    </div>
  </template>

  <script type="module" src="flux.js"></script>
</body>
</html>
